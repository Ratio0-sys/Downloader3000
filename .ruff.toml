# Настройка проверки кода.
#
# Лежит в корне не по прихоти: ruff ищет конфиг от проверяемого файла
# вверх по папкам, поэтому один общий на src/ и tools/ может лежать
# только над ними обоими. Имя с точки — чтобы не мозолил глаза
# рядом с README, как .gitignore.
#
# Набор правил держим здесь, а не в командной строке: правила, выбранные
# флагом --select, перебивают ignore из конфига, и отключить лишнее
# становится нечем.
#
# Правила RUF001-003 ругаются на каждую кириллическую букву, похожую
# на латинскую («а», «с», «о»). Комментарии в проекте на русском —
# это соглашение, поэтому такие срабатывания только прячут настоящие
# ошибки за тысячами строк шума. Отключены осознанно.
[lint]
select = ["F", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
